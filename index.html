<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Minimal Todo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script type="module" src="app.js"></script>

<style>
/* ================= BASE ================= */
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  background: linear-gradient(180deg, #020617, #020617);
  color: #e5e7eb;
  margin: 0;
}

h1,h2,h3 {
  margin: 0 0 10px 0;
}

button {
  background: linear-gradient(135deg, #2563eb, #1e40af);
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 500;
}

button.secondary {
  background: #020617;
  border: 1px solid #1e293b;
}

input {
  padding: 8px;
  border-radius: 10px;
  border: none;
  background: #020617;
  color: #e5e7eb;
  border: 1px solid #1e293b;
}

input::placeholder {
  color: #64748b;
}

/* ================= NAV ================= */
nav {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(2,6,23,0.8);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid #1e293b;
}

.nav-inner {
  max-width: 900px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
}

.nav-links {
  display: flex;
  gap: 8px;
}

.nav-links button {
  background: transparent;
  border: 1px solid #1e293b;
}

/* ================= LAYOUT ================= */
.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: radial-gradient(circle at top, #020617, #020617);
  border: 1px solid #1e293b;
  padding: 16px;
  border-radius: 16px;
  margin-bottom: 16px;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.02);
}

/* ================= PAGES ================= */
.page {
  display: none;
}

.page.active {
  display: block;
}

/* ================= TASKS ================= */
.task {
  padding: 10px;
  border-bottom: 1px dashed #1e293b;
}

.task.completed { color: #22c55e; }
.task.missed { color: #ef4444; }

/* ================= LEADERBOARD ================= */
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.tabs button {
  flex: 1;
  background: #020617;
  border: 1px solid #1e293b;
}

.tabs button.active {
  background: linear-gradient(135deg, #2563eb, #1e40af);
}

.leaderboard-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px dashed #1e293b;
}

/* ================= AUTH ================= */
#authSection {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
</style>
</head>

<body>

<!-- ================= AUTH ================= -->
<div id="authSection">
  <button id="loginBtn">Sign in with Google</button>
</div>

<!-- ================= APP ================= -->
<div id="app" style="display:none">

  <!-- NAV -->
  <nav>
    <div class="nav-inner">
      <strong id="userName"></strong>
      <div class="nav-links">
        <button onclick="showPage('tasksPage')">Tasks</button>
        <button onclick="showPage('friendsPage')">Friends</button>
        <button onclick="showPage('leaderboardPage')">Leaderboard</button>
        <button class="secondary" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container">

    <!-- ================= TASKS PAGE ================= -->
    <section id="tasksPage" class="page active">
      <div class="card">
        <h3>Add Task</h3>
        <input id="taskText" placeholder="Task name" />
        <input id="taskTime" type="number" placeholder="Minutes (optional)" />
        <button id="addTask">Add Task</button>
      </div>

      <div class="card">
        <h3>Today's Tasks</h3>
        <div id="taskList"></div>
      </div>
    </section>

    <!-- ================= FRIENDS PAGE ================= -->
    <section id="friendsPage" class="page">
      <div class="card">
        <h3>Add Friend</h3>
        <input id="friendUsername" placeholder="Friend username" />
        <button id="addFriend">Add Friend</button>
      </div>

      <div class="card">
        <h3>Friends Activity</h3>
        <div id="friendsTasks"></div>
      </div>
    </section>

    <!-- ================= LEADERBOARD PAGE ================= -->
    <section id="leaderboardPage" class="page">
      <div class="card">
        <h3>Leaderboard</h3>

        <div class="tabs">
          <button class="active" onclick="setLeaderboard('daily')">Daily</button>
          <button onclick="setLeaderboard('weekly')">Weekly</button>
          <button onclick="setLeaderboard('overall')">Overall</button>
        </div>

        <div id="leaderboard"></div>
      </div>
    </section>

  </div>
</div>

<!-- ================= UI SCRIPT (NO FIREBASE) ================= -->
<script>
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function setLeaderboard(type) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');

  // app.js will react to this later
  document.getElementById('leaderboard').dataset.mode = type;
}
</script>

</body>
</html>
