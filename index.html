<style>
body {
  font-family: system-ui, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
  margin: 0;
  padding: 20px;
}
h1 { font-size: 1.4rem; }
button {
  background: #2563eb;
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
}
input {
  padding: 6px;
  border-radius: 6px;
  border: none;
}
.card {
  background: #020617;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 10px;
}
.small { font-size: 0.8rem; color: #94a3b8; }
.flex { display: flex; gap: 8px; flex-wrap: wrap; }
.task.completed { color: #22c55e; }
.task.missed { color: #ef4444; }
hr { border: none; border-top: 1px solid #1e293b; margin: 15px 0; }
</style>
</head>

<body>

<h1>🧠 Minimal Todo</h1>
<div id="authSection">
  <button id="loginBtn">Sign in with Google</button>
</div>

<div id="app" style="display:none">
  <div class="card">
    <div class="flex">
      <strong id="userName"></strong>
      <button id="logoutBtn">Logout</button>
    </div>
  </div>

  <div class="card">
    <h3>Add Task</h3>
    <input id="taskText" placeholder="Task name" />
    <input id="taskTime" type="number" placeholder="Minutes (optional)" />
    <button id="addTask">Add</button>
  </div>

  <div class="card">
    <h3>Today's Tasks</h3>
    <div id="taskList"></div>
  </div>

  <div class="card">
    <h3>Leaderboard</h3>
    <div id="leaderboard"></div>
  </div>

  <div class="card">
    <h3>Friends</h3>
    <input id="friendUid" placeholder="Friend UID" />
    <button id="addFriend">Add Friend</button>
    <div id="friendsTasks"></div>
  </div>
</div>

</body>
</html>
